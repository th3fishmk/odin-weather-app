<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-app</title>
  </head>
  <body>
    <div id="app">
      <h1>Weather app</h1>
      <br>
      <form>
        <label for="city_name">Please enter a city name:</label>
        <input type="text" id="city_name" required value="london">
        <br>
        <label for="date-onlys">What date you want to check the weather</label>
        <input type="date" name="date" id="date-only" required>
        <br>
        <label for="forecastAPI">Enter your api key</label>
        <input type="text" placeholder="Your API key" id="forecastAPI" required>
        <br>
        <button type="button" id="fetchData">Check</button>
      </form>

      <br>
      <div id="data-space">

      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
